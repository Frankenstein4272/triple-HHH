name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install "flet[all]" flet-cli supabase

      - name: Build APK
        run: |
          flet build apk --project shipping_app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Triple-H-App
          path: build/apk/*.apk