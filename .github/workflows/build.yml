name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]" flet-cli supabase google-genai pillow reportlab arabic-reshaper python-bidi pandas openpyxl

      - name: Prepare App Icon
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
          fi

      - name: Build APK
        run: |
          flutter config --no-analytics
          flet build apk --project "triple_h" --product "Triple H" --org "com.tripleh" --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Triple-H-App
          path: build/apk/*.apk
